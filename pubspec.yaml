name: atrio
description: "Atrio - Marketplace Premium de Espacios, Experiencias y Servicios"
publish_to: 'none'
version: 1.1.5+9

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2

  # Navigation
  go_router: ^17.1.0

  # Supabase
  supabase_flutter: ^2.12.0

  # UI
  cached_network_image: ^3.4.1
  google_fonts: ^8.0.2

  # Date/Time
  table_calendar: ^3.2.0
  intl: ^0.20.2

  # Media
  image_picker: ^1.2.1
  flutter_image_compress: ^2.4.0

  # Maps & Location
  google_maps_flutter: ^2.17.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # Charts
  fl_chart: ^1.1.1

  # Local Storage
  shared_preferences: ^2.5.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Connectivity
  connectivity_plus: ^7.1.1

  # Push notifications (Firebase Cloud Messaging + local display)
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^21.0.0

  # Analytics + Crash reporting
  firebase_analytics: ^12.0.0
  sentry_flutter: ^9.6.0

  # Sharing
  share_plus: ^12.0.1
  url_launcher: ^6.3.2

  # Payments
  http: ^1.6.0
  webview_flutter: ^4.13.1

  # Environment
  flutter_dotenv: ^6.0.0

  # Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.12.2
  riverpod_generator: ^4.0.3
  freezed: ^3.2.5
  json_serializable: ^6.13.0

  # App Icon Generation
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#D4FF00"
  adaptive_icon_foreground: "assets/images/icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
    - assets/images/
